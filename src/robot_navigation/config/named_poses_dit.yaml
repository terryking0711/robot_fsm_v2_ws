named_poses:
  reset_pose_stage3: # 絕對
    x: 5.425
    y: 1.0
    yaw: 0.0

  # ----

  stage2_move_forward_align: # 絕對
    x: 6.84
    y: 2.825928797863046
    yaw: 3.1416
    precise: true

  stage2_return_point: # 絕對
    x: 7.798895024943465
    y: 3.061225912802044
    yaw: 3.1416
  # ----



  # 第二關
  stage2_entry:
    x: 5.93001965269284
    y: 2.9709128458801056
    yaw: -3.1415853071795867
    precise: true

  stage2_move_back: # 相對
    # 改相對前的絕對值：x: 6.750236207566257, y: 1.9939921350045575, yaw: 3.1416
    relative_to: stage2_move_forward_align
    dx: -0.01382
    dy: 0.093992
    dyaw: 0.0
  


  # 第三關
  stage3_entry:  # 相對 stage3_row4_start（第三關從第四排外面衝進去）
    relative_to: stage3_row4_start
    dx: 0.0
    dy: -0.8
    dyaw: 0.0

  # row1
  stage3_row1_start: # 相對
    # 改相對前的絕對值：x: 1.0550187186952673, y: 2.179703356968716, yaw: 1.5623
    relative_to: stage3_row4_start
    dx: 1.2
    dy: 0.0
    dyaw: 0.0
  stage3_row1_end: # 相對
    relative_to: stage3_row4_start
    dx: 1.2
    dy: 2.05
    dyaw: 0.0

  # row2
  stage3_row2_start: # 相對
    relative_to: stage3_row4_start
    dx: 0.8
    dy: 0.0
    dyaw: 0.0
  stage3_row2_end: # 相對
    relative_to: stage3_row4_start
    dx: 0.8
    dy: 2.05
    dyaw: 0.0

  # row3
  stage3_row3_start: # 相對
    relative_to: stage3_row4_start
    dx: 0.4
    dy: 0.0
    dyaw: 0.0
  stage3_row3_end: # 相對
    relative_to: stage3_row4_start
    dx: 0.4
    dy: 2.05
    dyaw: 0.0

  # row4
  stage3_row4_start: # 絕對（第三關所有點都相對這個點）
    x: -0.15133147826470222
    y: 2.1808418538001313
    yaw: 1.5623
  stage3_row4_end: # 相對
    relative_to: stage3_row4_start
    dx: 0.0
    dy: 1.95
    dyaw: 0.0      # 排尾

  stage3_place: # 絕對
    x: -0.22742
    y: 4.41
    yaw: -1.579285

  # 第二關到第三關先橫走再直走：只相對返回點。
  # dx = 設定時 stage3_entry.x - stage2_return_point.x（固定偏移，world frame）。
  stage2_to_stage3_corner:
    relative_to: stage2_return_point
    dx: -7.950226503208167
    dy: 0.0
    dyaw: 0.0

  # row4 排尾後方 70 cm，朝向相對排尾轉 180 度。dx/dy 為 world frame。
  stage3_place_approach:
    relative_to: stage3_row4_end
    dx: 0.1
    dy: -1.0
    dyaw: 3.141592653589793
