
named_poses:
  # 絕對
  # 第二關
  stage2_entry:
    x: 2.735
    y: 1.11
    yaw: -1.5881853071795862

  stage2_move_forward_align:
    x: 2.6526696442813778
    y: -0.12247551941821744
    yaw: -1.5881853071795862
    precise: true

  stage2_return_point:
    x: 2.5
    y: -3.6
    yaw: 3.1416
  
  # 第三關

  stage3_row4_start:
    x: 3.142
    y: -5.7259026254900816
    yaw: 3.1416
  
  stage3_place:
    x: 0.93
    y: -5.73
    yaw: 0.0
    precise: true

  #--------------------------------------------------------
  # 相對

  # 第二關
  reset_pose_stage3:
    x: 0.5
    y: -3.5
    yaw: 0.0

  stage2_move_back:
    # 改相對前的絕對值：x: 2.6704955184013617, y: -0.15041946071279797, yaw: 4.695
    relative_to: stage2_move_forward_align
    dx: -0.27
    dy: 0.0
    dyaw: 0.0
  
  # 第三關
  stage3_entry:  # 相對 stage3_row4_start（第三關從第四排外面衝進去）
    # 改相對前的絕對值：x: 0.6245973535586964, y: -3.7774917229480574, yaw: 4.695
    relative_to: stage3_row4_start
    dx: 0.7
    dy: 0.0
    dyaw: 0.0

  # row1
  stage3_row1_start:
    # 改相對前的絕對值：x: 3.4, y: -4.6, yaw: 3.1416
    relative_to: stage3_row4_start
    dx: 0.0
    dy: 1.2
    dyaw: 0.0
  stage3_row1_end:
    relative_to: stage3_row4_start
    dx: -2.05
    dy: 1.2
    dyaw: 0.0

  # row2
  stage3_row2_start:
    relative_to: stage3_row4_start
    dx: 0.0
    dy: 0.8
    dyaw: 0.0
  stage3_row2_end:
    relative_to: stage3_row4_start
    dx: -2.05
    dy: 0.8
    dyaw: 0.0

  # row3
  stage3_row3_start:
    relative_to: stage3_row4_start
    dx: 0.0
    dy: 0.4
    dyaw: 0.0
  stage3_row3_end:
    relative_to: stage3_row4_start
    dx: -2.05
    dy: 0.4
    dyaw: 0.0

  # row4
  stage3_row4_end:
    relative_to: stage3_row4_start
    dx: -1.95
    dy: 0.0
    dyaw: 0.0      # 排尾


  # 第二關到第三關先橫走再直走：只相對返回點。
  # dx = 設定時 stage3_entry.x - stage2_return_point.x（固定偏移，world frame）。
  stage2_to_stage3_corner:
    relative_to: stage2_return_point
    dx: 1.75
    dy: 0.0
    dyaw: 0.0

  # row3 排尾後方 70 cm，朝向相對排尾轉 180 度。dx/dy 為 world frame。
  stage3_place_approach:
    relative_to: stage3_row4_end
    dx: 1.0
    dy: 0.2
    dyaw: 3.141592653589793

  # START MIRROR V2 only; world y + 0.4 m, same heading.
  s3_entry_v2:
    relative_to: stage3_entry
    dx: 0.0
    dy: 0.4
    dyaw: 0.0
