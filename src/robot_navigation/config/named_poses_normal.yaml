
named_poses:
  # 絕對
  #--------------------------------------------------------
  # 第二關
  stage2_entry:
    x: 2.694
    y: 1.22
    yaw: -1.5881853071795862

  stage2_move_forward_align:
    x: 2.609826532698302
    y: 2.087239712954583
    yaw: -1.5881853071795862
    precise: true
  
  stage2_return_point:
    x: 2.3
    y: 5.7009030532771645
    yaw: 3.1416
    
  # 第三關

  stage3_row4_start:
      x: 2.6764631254179703
