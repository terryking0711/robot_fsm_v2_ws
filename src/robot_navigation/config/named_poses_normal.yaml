      yaw: 3.1416

  stage3_place:
    x: 0.477125024984774
    y: 7.916
    yaw: 0.0

  #--------------------------------------------------------
  # 相對
  reset_pose_stage3:
    x: 0.4
    y: 5.5
    yaw: 0.0


  stage2_move_back:
    # 改相對前的絕對值：x: 2.6539117725773123, y: 2.067345968327748, yaw: 4.695
    relative_to: stage2_move_forward_align
    dx: -0.27
    dy: 0.0
    dyaw: 0.0
  



  # 第三關
  stage3_entry:  # 相對 stage3_row4_start（第三關從第四排外面衝進去）
    # 改相對前的絕對值：x: 0.524321659455427, y: 3.567879879121584, yaw: 0.0
    relative_to: stage3_row4_start
    dx: 0.7
    dy: 0.0
    dyaw: 0.0

  stage3_row1_start:
    # 改相對前的絕對值：x: 2.685, y: 6.7, yaw: 3.1416
    relative_to: stage3_row4_start
    dx: 0.0
    dy: -1.2
    dyaw: 0.0

  stage3_row1_end:
    relative_to: stage3_row4_start
    dx: -1.95
    dy: -1.2
    dyaw: 0.0

  stage3_row2_start:
    relative_to: stage3_row4_start
    dx: 0.0
    dy: -0.8
    dyaw: 0.0

  stage3_row2_end:
    relative_to: stage3_row4_start
    dx: -1.95
    dy: -0.8
    dyaw: 0.0

  stage3_row3_start:
    relative_to: stage3_row4_start
    dx: 0.0
    dy: -0.4
    dyaw: 0.0

  stage3_row3_end:
    relative_to: stage3_row4_start
    dx: -1.95
    dy: -0.4
    dyaw: 0.0

  

  stage3_row4_end:
    relative_to: stage3_row4_start
    dx: -1.95
    dy: 0.0
    dyaw: 0.0      # 排尾


    # 第二關到第三關先橫走再直走：只相對返回點。
    # dx = 設定時 stage3_entry.x - stage2_return_point.x（固定偏移，world frame）。
  stage2_to_stage3_corner:
    relative_to: stage2_return_point
    dx: 1.185  # NORMAL；MIRROR 為 1.75
    dy: 0.0
    dyaw: 0.0
  # row3 排尾後方 70 cm，朝向相對排尾轉 180 度。dx/dy 為 world frame。
  stage3_place_approach:
    relative_to: stage3_row3_end
    dx: 0.700000000
    dy: 0.000000000
    dyaw: 3.141592653589793
