# 【NORMAL 場地】field_config.yaml 的 sides.normal 使用這份檔案
# ============================================================================
# named poses（導航目標點）
#
# ⚠ 座標系已從 map frame 改為 world frame（場地最左下角為 (0,0)）。
#    navigation_server 會把 goal 的 frame_id 設為 "world"，
#    Nav2 planner_server 透過 world -> map 靜態 TF 自動轉換。
#
# 換算關係：world = map + (0.425, 1.0)，yaw 不變。
# 以下數值是把原本 map frame 的佔位值直接加上偏移換算而來，
# 實際比賽點位量測後再更新。
# ============================================================================
named_poses:
  # 場地定位點（robot_fsm_main 讀取，不是導航目標）
  #   start_pose        : 比賽出發點，FSM 開始時送給 localization_manager 初始化
  #   reset_pose_stageN : 場外重置後重新定位用的點
  # ⚠ reset_pose_stage1~4 目前是佔位值，量測後更新。
  start_pose:
    x: 0.524321659455427
    y: 3.567879879121584
    yaw: 0.0

  reset_pose_stage1:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage2:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage3:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage4:
    x: 0.425
    y: 1.0
    yaw: 0.0

  # leave_start_zone:
  #   x: 0.48007
  #   y: 3.06604
  #   yaw: 0.0
  
  leave_start_zone:
    x: 0.44997966829918495
    y: 1.0241514083483043
    yaw: 0.0

  # 第二關
  stage2_entry:
    x: 2.4079140559868506
    y: 1.21477559974762
    yaw: 4.695

  stage2_push_clam_allign:
    x: 2.6850210543656905
    y: 1.2141119777422933
    yaw: 4.695

  stage2_move_forward_align:
    x: 2.6539117725773123
    y: 2.067345968327748
    yaw: 4.695

  stage2_move_back:
    x: 2.6539117725773123
    y: 2.067345968327748
    yaw: 4.695
  
  stage2_return_point:
    x: 2.60789051770523
    y: 4.009030532771645
    yaw: 4.695



  # 第三關
  stage3_entry:  # 相對 stage3_row1_start，格式見下方「相對點位」說明
    # 改相對前的絕對值：x: 0.524321659455427, y: 3.567879879121584, yaw: 0.0
    relative_to: stage3_row1_start
    dx: 0.85
    dy: 0.0
    dyaw: 0.0

  stage3_row1_start:
    x: 2.685
    y: 6.7
    yaw: 3.1416

  stage3_row1_end:
    relative_to: stage3_row1_start
    dx: -2.26
    dy: 0.0
    dyaw: 0.0

  stage3_row2_start:
    relative_to: stage3_row1_start
    dx: 0.0
    dy: 0.4
    dyaw: 0.0

  stage3_row2_end:
    relative_to: stage3_row1_start
    dx: -2.26
    dy: 0.4
    dyaw: 0.0

  stage3_row3_start:
    relative_to: stage3_row1_start
    dx: 0.0
    dy: 0.8
    dyaw: 0.0

  stage3_row3_end:
    relative_to: stage3_row1_start
    dx: -2.26
    dy: 0.8
    dyaw: 0.0

  stage3_row4_start:
    relative_to: stage3_row1_start
    dx: 0.0
    dy: 1.2
    dyaw: 0.0

  stage3_row4_end:
    relative_to: stage3_row1_start
    dx: -2.26
    dy: 1.2
    dyaw: 0.0      # 排尾，yaw = 掃描方向（不轉；放置前的旋轉看 stage3_place_rotate）

  # 放置前原地旋轉（Stage3HayFSM 讀取）：到 stage3_row4_end 後原地轉 dyaw 再放置。
  #   dyaw > 0 = 逆時針（往左轉）、dyaw < 0 = 順時針（往右轉），從上往下看。dx / dy 固定 0。
  stage3_place_rotate:
    relative_to: stage3_row4_end
    dx: 0.0
    dy: 0.0
    dyaw: -3.1416   # 順時針 180°
