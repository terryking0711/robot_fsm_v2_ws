# 【NORMAL 場地】field_config.yaml 的 sides.normal 使用這份檔案
# ============================================================================
# named poses（導航目標點）
#
# ⚠ 座標系已從 map frame 改為 world frame（場地最左下角為 (0,0)）。
#    navigation_server 會把 goal 的 frame_id 設為 "world"，
#    Nav2 planner_server 透過 world -> map 靜態 TF 自動轉換。
#
# 換算關係：world = map + (0.425, 1.0)，yaw 不變。
# 以下數值是把原本 map frame 的佔位值直接加上偏移換算而來，
# 實際比賽點位量測後再更新。
# ============================================================================
named_poses:
  # 場地定位點（robot_fsm_main 讀取，不是導航目標）
  #   start_pose        : 比賽出發點，FSM 開始時送給 localization_manager 初始化
  #   reset_pose_stageN : 場外重置後重新定位用的點
  # ⚠ reset_pose_stage1~4 目前是佔位值，量測後更新。
  start_pose:
    x: 0.524321659455427
    y: 3.567879879121584
    yaw: 0.0

  reset_pose_stage1:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage2:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage3:
    x: 0.425
    y: 1.0
    yaw: 0.0

  reset_pose_stage4:
    x: 0.425
    y: 1.0
    yaw: 0.0

  # leave_start_zone:
  #   x: 0.48007
  #   y: 3.06604
  #   yaw: 0.0
  
  leave_start_zone:
    x: 0.524321659455427
    y: 3.567879879121584
    yaw: 0.0

  # 第一關
  stage1_entry:
    x: 2.48007
    y: 4.06604
    yaw: 0.0

  # 第二關
  stage2_entry:
    x: 0.701
    y: 1.9766
    yaw: 3.1416

  stage2_push_clam_allign:
    x: 0.7334
    y: 1.82379
    yaw: 3.1416

  stage2_move_forward_align:
    x: 1.5328171396843675
    y: 1.7916279234790295
    yaw: 3.1416

  stage2_return_point:
    x: 5.55437
    y: 3.0
    yaw: 3.1416

  # 第三關
  stage3_entry:
    x: 0.524321659455427
    y: 3.567879879121584
    yaw: 0.0

  stage3_pick_pose:
    x: 5.55437
    y: 2.0
    yaw: 3.1416

  stage3_stack_pose:
    x: 0.524321659455427
    y: 3.567879879121584
    yaw: 0.0

  # 第三關蛇行掃描的 4 排（Stage3HayFSM 讀取）
  #   stage3_row{i}_start : Nav2 導航目標 = 掃描起點，停在該排第一個格點前方，
  #                         yaw 朝向掃描方向（第 2、4 排的起點在場地另一端）
  #   stage3_row{i}_end   : 掃描終點 = 機器碰到該排最後一個格點稻草時的機器位置，
  #                         只用來算方向與「到排尾了沒」，不會導航過去（yaw 不使用）
  # ⚠ 目前全是 0 的佔位值，FSM 會拒絕執行（S3_FAILED），請用 named_pose_recorder 實測後填入。

  stage3_row1_start:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row1_end:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row2_start:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row2_end:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row3_start:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row3_end:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row4_start:
    x: 0.0
    y: 0.0
    yaw: 0.0

  stage3_row4_end:
    x: 0.0
    y: 0.0
    yaw: 0.0

